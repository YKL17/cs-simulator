name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate career system scripts
        run: |
          node --check public/events-extra.js
          node --check public/team-system.js
          node --check public/team-cap-32.js
          node --check public/tournament-world.js
          node --check public/balance-ui-fix.js
          node --check public/career-flow-v2.js
          node --check public/ranking-score-v2.js
          node --check public/career-balance-v3.js
          node --check public/shop-modal-fix.js
          node --check public/ranking-dedup-fix.js
          node --check public/event-system-v4.js
          node --check public/competition-calibration-v6.js
          node --check public/major-month-fix-v7.js
          node --check public/team-chemistry-prep-v8.js
          node --check public/meta-system.js
          node --check public/prep-name-fix-v9.js
          node --check public/annual-rating-v10.js
          node --check public/single-event-result-v11.js
          node --check public/prep-state-fix-v12.js
          node --check public/economy-prep-v13.js
          node --check public/career-expansion-v14.js
          node --check public/retirement-choice-v15.js
          node --check public/settings-system-v17.js
          node --check public/branding-v17.js
          node --check public/ranking-progression-v18.js
          node --check public/ranking-season-decay-v19.js
          node --check public/i18n-v20.js
          node --check public/i18n-v20-supplement.js

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
